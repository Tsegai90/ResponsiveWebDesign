<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Styled To-Do List</title>
  <link rel="stylesheet" href="styles11.css">
</head>

<body>

  <ul class="todo-list">
    <li>
      <input type="checkbox" id="task1">
      <label for="task1">Learn HTML</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">
            Practice HTML
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task2">
      <label for="task2">Learn CSS</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">
            Practice CSS
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Build Projects</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">
            Create Apps
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task4">
      <label for="task4">Improve Skills</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">
            Keep Learning
          </a>
        </li>
      </ul>
    </li>
  </ul>

</body>

</html>
