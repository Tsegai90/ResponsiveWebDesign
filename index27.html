<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta  name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>playing cards</title>
        <link rel="stylesheet" href="styles.css" >
    </head>
    <body>
<main id="playing-cards">

  <div class="card">
    <div class="left">
      <div>A</div>
      <div>♠</div>
    </div>

    <div class="middle">♠</div>

    <div class="right">
      <div>♠</div>
      <div>A</div>
    </div>
  </div>

  <div class="card red">
    <div class="left">
      <div>K</div>
      <div>♥</div>
    </div>

    <div class="middle">♥</div>

    <div class="right">
      <div>♥</div>
      <div>K</div>
    </div>
  </div>

  <div class="card">
    <div class="left">
      <div>Q</div>
      <div>♣</div>
    </div>

    <div class="middle">♣</div>

    <div class="right">
      <div>♣</div>
      <div>Q</div>
    </div>
  </div>

</main>

    </body>
    </html>
