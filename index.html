<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ናይ ቡና መኑ</title>
    <link href="styles.css" rel="stylesheet"/>
  </head>
  <body>
    <div class="menu">
      <main>
        <h1> ቤት ቡና ጸጋይ </h1>
        <p class="established">Est. 2020</p>
        <hr>
        <section>
          <h2>ቡና</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon"/>
          <article class="item">
            <p class="flavor">ፍረንች ቨኒላ </p><p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="flavor">ካራመል ማክያቶ</p><p class="price">3.75</p>
          </article>
          <article class="item">
            <p class="flavor">ፓምፒኪን ስፓይስ</p><p class="price">3.50</p>
          </article>
          <article class="item">
            <p class="flavor">ሀይዝልናት</p><p class="price">4.00</p>
          </article>
          <article class="item">
            <p class="flavor">ሞካ</p><p class="price">4.50</p>
          </article>
        </section>
        <section>
          <h2>ድዘርትስ(መግቢ)</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon"/>
          <article class="item">
            <p class="dessert">ዶናት </p><p class="price">1.50</p>
          </article>
          <article class="item">
            <p class="dessert">ችሪ ፕየ</p><p class="price">2.75</p>
          </article>
          <article class="item">
            <p class="dessert">ቺዝ ኬክ</p><p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="dessert">ሲናምን ሮል</p><p class="price">2.50</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <a href="https://github.com/Tsegai90/ResponsiveWebDesign" target="_blank">ናብ ወብሳይተይ ጠውቂኩም ክትከዱ ትኽሉ ኢኹም</a>
          </p>
          <p class="address">ደቨረክ</p>
        </address>
      </footer>
    </div>
  </body>
</html>
