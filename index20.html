<!DOCTYPE html>
<html lang="en">

<head>

    <title>Contact Form</title>
    <link rel="sheetstyle" href="styles.css"
</head>

<body>
<div class="form-container">

        <h2>Contact us </h2>

        id="name"

        required>

        id="email"
        name="email"

        <label for="textarea" name="textarea">feedback

        name="textarea" 
        required >

        </label>

    </form>
</div>
</body>

</html>
